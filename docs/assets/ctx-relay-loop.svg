<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="ctx-relay loop: context grows turn by turn while the band stays empty; past the handoff line a 60-second countdown with Cancel appears; the mod writes a handoff file that quotes your last messages and splits Verified, Unconfirmed and Failed; runs /clear; and the fresh conversation checks the unconfirmed item first. Loops every 14 seconds.">
  <!-- 14 秒一輪：0–3.5 秒 context 長、3.5–5 倒數、5–7 寫交接檔、7–9 /clear、9–13.5 新對話接續、13.5–14 淡出重來 -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .dim { fill: #8b949e; font-size: 12px; }
    .txt { fill: #c9d1d9; font-size: 13px; }
    .head { fill: #e6edf3; font-size: 13px; font-weight: 700; }
    .user { fill: #30363d; }
    .bot { fill: #21262d; }

    /* 對話列：依序出現，/clear 時一起消失 */
    .l1 { animation-name: l1; } @keyframes l1 { 0%,2.86% { opacity: 0 } 4.64%,50% { opacity: 1 } 51.79%,100% { opacity: 0 } }
    .l2 { animation-name: l2; } @keyframes l2 { 0%,7.86% { opacity: 0 } 9.64%,50% { opacity: 1 } 51.79%,100% { opacity: 0 } }
    .l3 { animation-name: l3; } @keyframes l3 { 0%,12.86% { opacity: 0 } 14.64%,50% { opacity: 1 } 51.79%,100% { opacity: 0 } }
    .l4 { animation-name: l4; } @keyframes l4 { 0%,17.86% { opacity: 0 } 19.64%,50% { opacity: 1 } 51.79%,100% { opacity: 0 } }
    .l5 { animation-name: l5; } @keyframes l5 { 0%,22.14% { opacity: 0 } 23.93%,50% { opacity: 1 } 51.79%,100% { opacity: 0 } }

    /* band：平時空的；倒數、寫檔、接續輪流出現 */
    .s1 { animation-name: s1; } @keyframes s1 { 0%,25% { opacity: 1 } 26.79%,100% { opacity: 0 } }
    .s2 { animation-name: s2; } @keyframes s2 { 0%,25% { opacity: 0 } 26.79%,35.71% { opacity: 1 } 37.5%,100% { opacity: 0 } }
    .s3 { animation-name: s3; } @keyframes s3 { 0%,35.71% { opacity: 0 } 37.5%,52.86% { opacity: 1 } 54.64%,100% { opacity: 0 } }
    .s4 { animation-name: s4; } @keyframes s4 { 0%,65.71% { opacity: 0 } 67.5%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }

    /* 交接檔：四欄一欄一欄寫出來，留到接手後 */
    .card { animation-name: card; } @keyframes card { 0%,35% { opacity: 0 } 36.79%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .f1 { animation-name: f1; } @keyframes f1 { 0%,37.14% { opacity: 0 } 38.93%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .f2 { animation-name: f2; } @keyframes f2 { 0%,40% { opacity: 0 } 41.79%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .f3 { animation-name: f3; } @keyframes f3 { 0%,42.86% { opacity: 0 } 44.64%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .f4 { animation-name: f4; } @keyframes f4 { 0%,45.71% { opacity: 0 } 47.5%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }

    /* /clear 閃一下 */
    .clear { animation-name: clear; } @keyframes clear { 0%,50% { opacity: 0 } 52.86%,58.57% { opacity: 1 } 62.86%,100% { opacity: 0 } }

    /* 新對話：接續訊息、箭頭、回覆 */
    .r1 { animation-name: r1; } @keyframes r1 { 0%,65% { opacity: 0 } 66.79%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .r2 { animation-name: r2; } @keyframes r2 { 0%,75.71% { opacity: 0 } 77.5%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .arrow { animation-name: arrow; } @keyframes arrow { 0%,67.14% { opacity: 0 } 68.93%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }

    /* 底下的步驟說明 */
    .c1 { animation-name: c1; } @keyframes c1 { 0%,25% { opacity: 1 } 26.79%,100% { opacity: 0 } }
    .c2 { animation-name: c2; } @keyframes c2 { 0%,25% { opacity: 0 } 26.79%,50% { opacity: 1 } 51.79%,100% { opacity: 0 } }
    .c3 { animation-name: c3; } @keyframes c3 { 0%,50% { opacity: 0 } 51.79%,64.29% { opacity: 1 } 66.07%,100% { opacity: 0 } }
    .c4 { animation-name: c4; } @keyframes c4 { 0%,64.29% { opacity: 0 } 66.07%,100% { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .t { animation: none; }
      .s2, .s3, .s4, .clear, .r1, .r2, .arrow, .c2, .c3, .c4 { opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="899" height="379" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- 對話 -->
  <rect x="24" y="24" width="520" height="290" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="46" class="dim">conversation</text>
  <rect class="t l1 user" x="40" y="62" width="300" height="16" rx="4"/>
  <rect class="t l2 bot" x="60" y="88" width="440" height="16" rx="4"/>
  <rect class="t l3 user" x="40" y="114" width="220" height="16" rx="4"/>
  <rect class="t l4 bot" x="60" y="140" width="460" height="16" rx="4"/>
  <rect class="t l5 bot" x="60" y="166" width="380" height="16" rx="4"/>

  <g class="t r1">
    <rect x="40" y="62" width="488" height="40" rx="4" fill="#30363d"/>
    <text x="52" y="80" class="txt">Read …/handoff/20261009-1530-demo-task.md</text>
    <text x="52" y="96" class="dim">and continue the task `demo-task`.</text>
  </g>
  <g class="t r2">
    <rect x="60" y="112" width="468" height="40" rx="4" fill="#21262d"/>
    <text x="72" y="130" class="txt">Checked git: matches. e2e is unconfirmed.</text>
    <text x="72" y="146" class="dim">Next: check its result. Waiting for you.</text>
  </g>

  <rect class="t clear" x="24" y="24" width="520" height="290" rx="8" fill="#e6edf3" opacity="0"/>
  <text class="t clear" x="284" y="176" text-anchor="middle" fill="#0d1117" font-size="28" font-weight="700" opacity="0">/clear</text>

  <!-- band：平時空的，只在交接時出現 -->
  <line x1="24" y1="262" x2="544" y2="262" stroke="#30363d"/>
  <text class="t s1 dim" x="40" y="292">band: empty until a handoff needs you</text>
  <text class="t s2 txt" x="40" y="292" style="fill:#D55E00">Handoff in 60s · at 434K</text>
  <g class="t s2"><rect x="460" y="279" width="72" height="20" rx="4" fill="#30363d"/><text x="496" y="293" text-anchor="middle" class="txt">Cancel [1]</text></g>
  <text class="t s3 txt" x="40" y="292">Writing handoff file…</text>
  <text class="t s4 txt" x="40" y="292">Resumed from …demo-task.md · next: check e2e result</text>

  <!-- 交接檔 -->
  <g class="t card">
    <rect x="570" y="24" width="306" height="290" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="586" y="46" class="dim">handoff/20261009-1530-demo-task.md</text>
    <text x="586" y="66" class="dim">&gt; you: ship it, but don't push yet</text>
  </g>
  <g class="t f1"><text x="586" y="92" class="head">## Goal</text><text x="586" y="110" class="txt">ship the demo build</text></g>
  <g class="t f2"><text x="586" y="136" class="head">## Files</text><text x="586" y="154" class="txt">M src/parse.ts</text></g>
  <g class="t f3">
    <text x="586" y="180" class="head">## Verified</text>
    <text x="586" y="198" class="txt">Verified: unit tests pass</text>
    <text x="586" y="214" class="txt">Unconfirmed: e2e run started</text>
    <text x="586" y="230" class="txt">Failed: fs mock (flaky)</text>
  </g>
  <g class="t f4"><text x="586" y="258" class="head">## Next</text><text x="586" y="276" class="txt">check the e2e result</text></g>

  <g class="t arrow">
    <path d="M568 82 C 556 82, 548 82, 532 82" stroke="#58a6ff" stroke-width="2" fill="none"/>
    <path d="M532 82 l 8 -5 v 10 z" fill="#58a6ff"/>
  </g>

  <!-- 步驟說明 -->
  <text class="t c1 txt" x="24" y="350">1 · Context grows turn by turn; the band stays empty (your status line shows usage)</text>
  <text class="t c2 txt" x="24" y="350">2 · Past the handoff line: a 60 s countdown, then the mod writes a handoff file</text>
  <text class="t c3 txt" x="24" y="350">3 · /clear</text>
  <text class="t c4 txt" x="24" y="350">4 · The fresh conversation reads the file, checks git, and checks what is unconfirmed first</text>
</svg>
